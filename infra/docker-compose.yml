# Secrets come from the environment / infra/.env (see infra/.env.example).
# Defaults below are for local dev ONLY; set real values for any shared host.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spylove}
      MYSQL_USER: ${MYSQL_USER:-spylove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spylove}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../backend/.env.example
      - path: ./.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spylove}
      MYSQL_USER: ${MYSQL_USER:-spylove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spylove}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 'api' lets Prometheus scrape api:8000 inside the compose network.
      ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.2.2,.ngrok-free.app,api}
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  celery:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A config worker -l info --concurrency=2
    user: appuser

    env_file:
      - ../backend/.env.example
      - path: ./.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spylove}
      MYSQL_USER: ${MYSQL_USER:-spylove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spylove}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SKIP_MIGRATIONS: "true"
    depends_on:
      - api
      - redis
    volumes:
      - ../backend:/app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  redis_data:
  grafana_data:
