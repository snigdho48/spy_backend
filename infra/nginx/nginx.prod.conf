worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    gzip off;

    # Docker embedded DNS. Re-resolve api after the container is recreated.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Cloudflare terminates TLS and sets X-Forwarded-Proto. When the header is
    # absent (an on-box probe that forgot it), default to https so Django's
    # SECURE_SSL_REDIRECT does not bounce tunnel traffic.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      https;
        default $http_x_forwarded_proto;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name spy.way2points.com;
        client_max_body_size 10m;

        set $api_upstream http://api:8000;

        location /health/ {
            access_log off;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /ws/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
        }
    }
}
